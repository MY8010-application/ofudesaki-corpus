<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>おふでさき 日モ　コーパス</title>
<span>データ更新：2026.08.31</span>
<link rel="manifest" href="manifest.json">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:sans-serif;
max-width:700px;
margin:auto;
padding:20px;
background:#c1c6c7;
}

h2{
text-align:center;
margin-bottom:20px;
}

input{
padding:12px;
font-size:18px;
margin-bottom:20px;
}

#results{
margin-top:10px;
}

.result{
border-bottom:1px solid #ccc;
padding:12px;
background:#a2deeb;
}
  
.jp{
font-weight:bold;
font-size:18px;
margin-top:6px;
}

.mn{
color:#555;
margin-top:4px;
font-family:"Times New Roman", serif;
}
  
.searchArea{
display:flex;
gap:10px;
margin-bottom:20px;
}

.searchArea input{
flex:1;
margin-bottom:0;
}

#searchButton{
padding:12px 20px;
font-size:18px;
background:#4285f4;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
white-space:nowrap;
}

@media (max-width:600px){

body{
padding:15px;
font-size:14px;
}

h2{
font-size:22px;
margin-bottom:15px;
}

.searchArea{
gap:8px;
}

.searchArea input{
font-size:16px;
padding:10px;
}

#searchButton{
font-size:16px;
padding:10px 14px;
}

.result{
padding:10px 0;
}

.jp{
font-size:16px;
}

.mn{
font-size:14px;
}

}
</style>

</head>

<body>

<h2>おふでさき 日モ　コーパス</h2>

<div class="searchArea">

<button id="searchButton">検索</button>

<input
id="searchJp"
type="text"
placeholder="日本語で検索"
autofocus
>

<input
id="searchMn"
type="text"
placeholder="モンゴル語で検索"
>

</div>

<div id="results"></div>

<script>

const searchJp = document.getElementById("searchJp");
const searchMn = document.getElementById("searchMn");
const results = document.getElementById("results");
  
let corpus = [];
let filteredResults = [];
let displayCount = 15;

fetch("corpus.json")
.then(response => {

if(!response.ok){
throw new Error("JSONの取得に失敗");
}

return response.json();

})
.then(data => {

corpus = data;

results.innerHTML = "データ読み込み完了：" + corpus.length + "件";

});

function showResults(){

results.innerHTML = "";

const displayResults = filteredResults.slice(0, displayCount);

displayResults.forEach(item => {

results.innerHTML += `
<div class="result">

<div>号：${item.issue}　首：${item.number}</div>

<div class="jp">${item.jp}</div>

<div class="mn">${item.mn}</div>

</div>
`;

});

if(displayCount < filteredResults.length){

results.innerHTML += `
<button id="moreButton">続きを表示</button>
`;

document.getElementById("moreButton").addEventListener("click", function(){

displayCount += 15;

showResults();

});

}

}

document.getElementById("searchButton").addEventListener("click", function(){

const jpWord = searchJp.value.trim().toLowerCase();
const mnWord = searchMn.value.trim().toLowerCase();

displayCount = 15;

if(jpWord === "" && mnWord === ""){

filteredResults = [];

results.innerHTML = "";

return;

}

filteredResults = corpus.filter(item => {

const jpMatch =
jpWord === "" ||
String(item.issue).includes(jpWord) ||
String(item.number).includes(jpWord) ||
String(item.jp).toLowerCase().includes(jpWord);

const mnMatch =
mnWord === "" ||
String(item.issue).includes(mnWord) ||
String(item.number).includes(mnWord) ||
String(item.mn).toLowerCase().includes(mnWord);

if(jpWord !== "" && mnWord === ""){
return jpMatch;
}

if(jpWord === "" && mnWord !== ""){
return mnMatch;
}

if(jpWord !== "" && mnWord !== ""){
return jpMatch && mnMatch;
}

return false;

});

showResults();

});
searchJp.addEventListener("keydown", function(event){

if(event.key === "Enter"){

document.getElementById("searchButton").click();

}

});

searchMn.addEventListener("keydown", function(event){

if(event.key === "Enter"){

document.getElementById("searchButton").click();

}

});
  
if ("serviceWorker" in navigator) {

window.addEventListener("load", () => {

navigator.serviceWorker.register("./service-worker.js");

});

}

</script>

</body>

</html>
