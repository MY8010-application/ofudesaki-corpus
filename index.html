<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>おふでさき 日モ　コーパス</title>
<span>データ更新：2026.11.06</span>
<link rel="manifest" href="manifest.json">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:sans-serif;
max-width:700px;
margin:auto;
padding:20px;
background:#c1c6c7;
}

h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
font-size:18px;
margin-bottom:20px;
}

#results{
margin-top:10px;
}

.result{
border-bottom:1px solid #ccc;
padding:12px;
background:#a2deeb;
}
  
.jp{
font-weight:bold;
font-size:18px;
margin-top:6px;
}

.mn{
color:#555;
margin-top:4px;
font-family:"Times New Roman", serif;
}
  
.searchArea{
display:flex;
gap:10px;
margin-bottom:20px;
}

.searchArea input{
flex:1;
margin-bottom:0;
}

#searchButton{
padding:12px 20px;
font-size:18px;
background:#4285f4;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
white-space:nowrap;
}
.highlight{
background:yellow;
color:#000;
font-weight:bold;
}
@media (max-width:600px){

body{
padding:15px;
font-size:14px;
}

h2{
font-size:22px;
margin-bottom:15px;
}

.searchArea{
gap:8px;
}

.searchArea input{
font-size:16px;
padding:10px;
}

#searchButton{
font-size:16px;
padding:10px 14px;
}

.result{
padding:10px 0;
}

.jp{
font-size:16px;
}

.mn{
font-size:14px;
}
  

}
</style>

</head>

<body>

<h2>おふでさき 日モ　コーパス</h2>

<div class="searchArea">

<input
id="jpSearch"
type="text"
placeholder="日本語で検索"
autofocus
>

<input
id="mnSearch"
type="text"
placeholder="モンゴル語で検索"
>

<button id="searchButton">検索</button>

</div>

<div id="results"></div>

<script>

const jpSearchBox = document.getElementById("jpSearch");
const mnSearchBox = document.getElementById("mnSearch");
const results = document.getElementById("results");

let corpus = [];
let filteredResults = [];
let displayCount = 15;

function highlightText(text, word){

if(!word) return text;

const escapedWord = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

const regex = new RegExp(`(${escapedWord})`, "gi");

return text.replace(regex, '<span class="highlight">$1</span>');

}
  
fetch("corpus.json")
.then(response => {

if(!response.ok){
throw new Error("JSONの取得に失敗");
}

return response.json();

})
.then(data => {

corpus = data;

});

function showResults(){

results.innerHTML = "";

const displayResults = filteredResults.slice(0, displayCount);

displayResults.forEach(item => {

results.innerHTML += `
<div class="result">

<div>号：${item.issue}　首：${item.number}</div>

<div class="jp">${highlightText(item.jp, jpSearchBox.value.trim())}</div>

<div class="mn">${highlightText(item.mn, mnSearchBox.value.trim())}</div>

</div>
`;

});

if(displayCount < filteredResults.length){

results.innerHTML += `
<button id="moreButton">続きを表示</button>
`;

document.getElementById("moreButton").addEventListener("click", function(){

displayCount += 15;

showResults();

});

}

}

document.getElementById("searchButton").addEventListener("click", function(){

const jpWord = jpSearchBox.value.trim().toLowerCase();
const mnWord = mnSearchBox.value.trim().toLowerCase();

displayCount = 15;

if(jpWord === "" && mnWord === ""){

filteredResults = [];
results.innerHTML = "";

return;

}

filteredResults = corpus.filter(item => {

const jpText = String(item.jp || "").toLowerCase();
const mnText = String(item.mn || "").toLowerCase();

const jpMatch = jpWord === "" || jpText.includes(jpWord);
const mnMatch = mnWord === "" || mnText.includes(mnWord);

return jpMatch && mnMatch;

});

showResults();

});
[jpSearchBox, mnSearchBox].forEach(searchBox => {

searchBox.addEventListener("keydown", function(event){

if(event.key === "Enter"){

document.getElementById("searchButton").click();

}

});

});
  
if ("serviceWorker" in navigator) {

window.addEventListener("load", () => {

navigator.serviceWorker.register("./service-worker.js");

});

}

</script>

</body>

</html>
