<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>おふでさき コーパス</title>
<link rel="manifest" href="manifest.json">
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:sans-serif;
max-width:700px;
margin:auto;
padding:20px;
}

h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
font-size:18px;
margin-bottom:20px;
}

#results{
margin-top:10px;
}

.result{
border-bottom:1px solid #ccc;
padding:12px 0;
}

.jp{
font-weight:bold;
font-size:18px;
margin-top:6px;
}

.mn{
color:#555;
margin-top:4px;
}

</style>

</head>

<body>

<h2>おふでさき コーパス</h2>

<input
id="search"
type="text"
placeholder="検索"
autofocus
>

<div id="results"></div>

<script>

const searchBox = document.getElementById("search");
const results = document.getElementById("results");

let corpus = [];

fetch("corpus.json")
.then(response => {

if(!response.ok){
throw new Error("JSONの取得に失敗");
}

return response.text();

})
.then(text => {

try{

const data = JSON.parse(text);

corpus = data;

results.innerHTML = "JSON解析成功：" + corpus.length + "件";

}catch(error){

results.innerHTML = "JSON解析エラー";

}

})
.catch(error => {

results.innerHTML = "データ読み込みエラー";

});
searchBox.addEventListener("input", function(){

const word = this.value.trim().toLowerCase();

results.innerHTML = "";

if(word === "") return;

corpus.forEach(item => {

if(
String(item.issue).includes(word) ||
String(item.number).includes(word) ||
String(item.jp).toLowerCase().includes(word) ||
String(item.mn).toLowerCase().includes(word)
){

results.innerHTML += `
<div class="result">

<div>号：${item.issue}　首：${item.number}</div>

<div class="jp">${item.jp}</div>

<div class="mn">${item.mn}</div>

</div>
`;

}

});

});

</script>

</body>

</html>
