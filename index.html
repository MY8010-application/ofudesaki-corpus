<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>おふでさき コーパス</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:sans-serif;
max-width:700px;
margin:auto;
padding:20px;
}

h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
font-size:18px;
margin-bottom:20px;
}

#results{
margin-top:10px;
}

</style>

</head>

<body>

<h2>おふでさき コーパス</h2>

<input
id="search"
type="text"
placeholder="検索"
autofocus
>

<div id="results"></div>

<script>

const GAS_URL = "https://script.google.com/macros/s/AKfycbyFI-CdMeqEh44ABzrbLZBKIrphuLTJZmK7qbmNqcjFDBfT_hSwroTYen9mkpM7yMhvdg/exec";

const searchBox = document.getElementById("search");
const results = document.getElementById("results");

let dictionary = [];

fetch(GAS_URL)
.then(response => response.json())
.then(data => {

dictionary = data;

showResults("");

});

function showResults(word){

results.innerHTML = "";

dictionary.forEach(item => {

if(
word === "" ||
String(item.issue).includes(word) ||
String(item.number).includes(word) ||
item.jp.includes(word) ||
item.mn.toLowerCase().includes(word.toLowerCase())
){

results.innerHTML += `
<div class="result">

<div>号：${item.issue}　首：${item.number}</div>

<div class="jp">${item.jp}</div>

<div class="mn">${item.mn}</div>

</div>
`;

}

});

}

searchBox.addEventListener("input", function(){

const word = this.value.trim();

showResults(word);

});

</script>
</body>

</html>
